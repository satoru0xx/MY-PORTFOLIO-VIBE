<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♛ NAMISH MAHAJAN ♛ | satoru0xx</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #05050a;
      --accent: #7c3aed;
      --accent-glow: rgba(124, 58, 237, 0.55);
      --cyan: #06b6d4;
      --glass: rgba(15, 17, 28, 0.72);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    body[data-accent="cyan"] {
      --accent: #06b6d4;
      --accent-glow: rgba(6, 182, 212, 0.55);
    }

    body[data-accent="crimson"] {
      --accent: #f43f5e;
      --accent-glow: rgba(244, 63, 94, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .enter-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #0d0e1a 0%, #030307 100%);
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s ease;
    }

    .enter-screen.fade-out {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }

    .enter-box {
      text-align: center;
      padding: 2.5rem 3.5rem;
      border: 1px solid rgba(124, 58, 237, 0.35);
      border-radius: 16px;
      background: rgba(10, 10, 18, 0.85);
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 40px var(--accent-glow);
    }

    .scanner-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      animation: scan 2.5s linear infinite;
    }

    @keyframes scan {
      0% { top: 0%; }
      100% { top: 100%; }
    }

    .boot-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--cyan);
      letter-spacing: 2px;
      margin-bottom: 1rem;
    }

    .glitch-btn {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 700;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 0 15px var(--accent-glow);
      animation: pulseText 2s infinite alternate;
    }

    @keyframes pulseText {
      from { text-shadow: 0 0 10px var(--accent-glow); }
      to { text-shadow: 0 0 25px var(--cyan), 0 0 40px var(--accent); }
    }

    .sub-boot {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .main-interface {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 550px;
      padding: 1.5rem;
      perspective: 1200px;
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .main-interface.hidden {
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      pointer-events: none;
    }

    .top-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      padding: 0 0.5rem;
    }

    .hud-pill {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: blink 1.5s infinite;
    }

    .theme-switcher {
      display: flex;
      gap: 0.45rem;
      background: var(--glass);
      border: 1px solid var(--border);
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
    }

    .theme-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .theme-dot.active, .theme-dot:hover {
      transform: scale(1.25);
      border-color: #ffffff;
    }

    .audio-hud {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      background: var(--glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 999px;
      width: fit-content;
      margin: 0 auto 1.15rem auto;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    #audio-toggle {
      background: var(--accent);
      border: none;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.75rem;
      display: grid;
      place-items: center;
      transition: transform 0.2s, background 0.3s;
    }

    #audio-toggle:hover {
      transform: scale(1.1);
    }

    .equalizer {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 14px;
    }

    .equalizer span {
      width: 3px;
      height: 4px;
      background: var(--cyan);
      border-radius: 2px;
      transition: height 0.2s;
    }

    .equalizer.playing span {
      animation: eqBounce 0.6s infinite alternate ease-in-out;
    }
    .equalizer.playing span:nth-child(2) { animation-delay: 0.15s; }
    .equalizer.playing span:nth-child(3) { animation-delay: 0.3s; }
    .equalizer.playing span:nth-child(4) { animation-delay: 0.45s; }

    @keyframes eqBounce {
      0% { height: 4px; }
      100% { height: 14px; }
    }

    .track-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--cyan);
      white-space: nowrap;
    }

    #volume-slider {
      width: 70px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .profile-card {
      position: relative;
      background: var(--glass);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.1rem 1.85rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      transform-style: preserve-3d;
      transition: transform 0.12s ease-out;
      overflow: hidden;
    }

    .card-glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.12), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card-header {
      text-align: center;
      transform: translateZ(25px);
    }

    .avatar-ring {
      position: relative;
      width: 108px;
      height: 108px;
      margin: 0 auto 1rem auto;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, var(--cyan), var(--accent), #ec4899);
      box-shadow: 0 0 25px var(--accent-glow);
      animation: floatAvatar 4s ease-in-out infinite;
    }

    @keyframes floatAvatar {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #090a12;
      border: 3px solid #090a12;
    }

    .status-dot {
      position: absolute;
      bottom: 5px;
      right: 5px;
      width: 17px;
      height: 17px;
      background: #10b981;
      border: 3px solid #090a12;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
    }

    .crown-title {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 0.25rem;
    }

    .crown-title span {
      background: linear-gradient(90deg, #fff, #c4b5fd, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .handle {
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .typewriter-box {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.45rem 1rem;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--cyan);
      margin-bottom: 1.35rem;
    }

    .cursor {
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .skills-ribbon {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-bottom: 0.65rem;
      transform: translateZ(20px);
    }

    .skill-pill {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .skill-pill:hover, .skill-pill.active-skill {
      border-color: var(--accent);
      background: rgba(124, 58, 237, 0.15);
      transform: translateY(-2px);
    }

    .skill-pill small {
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      font-size: 0.7rem;
    }

    .skill-detail {
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
      min-height: 1.1rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      margin-bottom: 1.25rem;
      transform: translateZ(15px);
    }

    .info-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem;
      transition: border-color 0.25s, transform 0.25s;
    }

    .info-box:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .info-box .label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    .info-box p {
      font-size: 0.92rem;
      font-weight: 600;
    }

    .github-section {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
      margin-bottom: 1.35rem;
      transform: translateZ(15px);
    }

    .gh-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .badge {
      background: rgba(124, 58, 237, 0.2);
      color: #c4b5fd;
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
    }

    .repo-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .repo-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.55rem 0.75rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      font-size: 0.85rem;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .repo-item:hover {
      border-color: var(--cyan);
      background: rgba(6, 182, 212, 0.08);
      transform: translateX(4px);
    }

    .repo-lang {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--cyan);
    }

    .social-dock {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      transform: translateZ(25px);
    }

    .dock-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      transition: all 0.25s;
    }

    .dock-btn.primary {
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      border: none;
      box-shadow: 0 8px 20px var(--accent-glow);
    }

    .dock-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.15);
    }

    @media (max-width: 480px) {
      .info-grid, .social-dock {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <audio id="local-audio" preload="auto" loop></audio>
  <canvas id="bg-canvas"></canvas>

  <div id="enter-screen" class="enter-screen">
    <div class="enter-box">
      <div class="scanner-line"></div>
      <p class="boot-text" id="boot-header">[ SYSTEM READY // USER: SATORU0XX ]</p>
      <h2 class="glitch-btn">CLICK TO START</h2>
      <p class="sub-boot" id="boot-sub">Launch 3D Interface &amp; Audio Stream</p>
    </div>
  </div>

  <main id="main-interface" class="main-interface hidden">
    <div class="top-hud">
      <div class="hud-pill">
        <span class="pulse-dot"></span>
        <span id="live-clock">00:00:00 IST</span>
      </div>
      <div class="theme-switcher" title="Switch Neon Accent">
        <button class="theme-dot active" data-theme="violet" style="background:#7c3aed;"></button>
        <button class="theme-dot" data-theme="cyan" style="background:#06b6d4;"></button>
        <button class="theme-dot" data-theme="crimson" style="background:#f43f5e;"></button>
      </div>
    </div>

    <div class="audio-hud">
      <button id="audio-toggle" title="Play/Pause">▶</button>
      <div class="equalizer" id="equalizer">
        <span></span><span></span><span></span><span></span>
      </div>
      <span class="track-name" id="track-status">Teapot - LuKremBo (Loop)</span>
      <span class="vol-icon">🔊</span>
      <input type="range" id="volume-slider" min="0" max="100" step="5" value="50">
    </div>

    <section class="profile-card" id="tilt-card">
      <div class="card-glare" id="card-glare"></div>

      <div class="card-header">
        <div class="avatar-ring">
          <img id="profile-avatar" src="avatar.png" alt="Avatar">
          <span class="status-dot" title="Online &amp; Coding"></span>
        </div>

        <h1 class="crown-title">♛ <span id="display-name">NAMISH MAHAJAN</span> ♛</h1>
        <p class="handle" id="display-handle">@satoru0xx • Age 13 • India</p>

        <div class="typewriter-box">
          <span class="prompt">~$</span>
          <span id="typewriter"></span><span class="cursor">|</span>
        </div>
      </div>

      <div class="skills-ribbon" id="skills-container"></div>
      <p id="skill-detail-box" class="skill-detail"></p>

      <div class="info-grid" id="info-container"></div>

      <div class="github-section">
        <div class="gh-header">
          <span id="gh-title">⚡ GITHUB TELEMETRY (satoru0xx)</span>
          <span id="gh-repo-count" class="badge">Syncing...</span>
        </div>
        <div id="gh-repos" class="repo-list">
          <div class="repo-item"><span>Fetching live repositories...</span></div>
        </div>
      </div>

      <div class="social-dock" id="buttons-container"></div>
    </section>
  </main>

  <script>
    // =========================================================================
    // ⚡ EASY EDIT ZONE: CHANGE ANYTHING BELOW TO UPDATE YOUR ENTIRE WEBSITE ⚡
    // =========================================================================
    const PORTFOLIO_CONFIG = {
      name: "NAMISH MAHAJAN",
      handle: "satoru0xx",
      age: 13,
      location: "India",
      timezone: "Asia/Kolkata",
      timezoneLabel: "IST",
      avatarFile: "avatar.png",
      githubUsername: "satoru0xx",

      music: {
        audioFile: "teapot.mp3",
        songTitle: "Teapot - LuKremBo (Loop)",
        defaultVolume: 50
      },

      roles: [
        "HTML & CSS Developer",
        "Learning JavaScript ⚡",
        "Future Software Engineer",
        "Gamer & Tech Enthusiast"
      ],

      skills: [
        {
          name: "HTML5",
          level: "100%",
          color: "#f97316",
          description: "HTML5: Semantic structure, Canvas API, SEO & modern layouts."
        },
        {
          name: "CSS3",
          level: "95%",
          color: "#38bdf8",
          description: "CSS3: 3D transforms, Glassmorphism, Keyframe animations, Grid & Flexbox."
        },
        {
          name: "JS",
          level: "LEARNING...",
          color: "#facc15",
          highlight: true,
          description: "JavaScript: Currently mastering DOM manipulation, Fetch APIs & interactive logic!"
        }
      ],

      infoCards: [
        { label: "🎯 CAREER GOAL", value: "Software Engineering" },
        { label: "🎮 INTERESTS", value: "Gaming & Emerging Tech" }
      ],

      buttons: [
        { label: "GitHub Profile", url: "https://github.com/satoru0xx", primary: true },
        { label: "📋 Copy Username", copyText: "satoru0xx", primary: false }
      ]
    };

    // =========================================================================
    // ⚙️ ENGINE CODE BELOW (NO NEED TO EDIT UNLESS YOU WANT CUSTOM LOGIC)
    // =========================================================================
    document.title = "♛ " + PORTFOLIO_CONFIG.name + " ♛ | " + PORTFOLIO_CONFIG.handle;
    document.getElementById("boot-header").textContent = "[ SYSTEM READY // USER: " + PORTFOLIO_CONFIG.handle.toUpperCase() + " ]";
    document.getElementById("display-name").textContent = PORTFOLIO_CONFIG.name;
    document.getElementById("display-handle").textContent = "@" + PORTFOLIO_CONFIG.handle + " • Age " + PORTFOLIO_CONFIG.age + " • " + PORTFOLIO_CONFIG.location;
    document.getElementById("gh-title").textContent = "⚡ GITHUB TELEMETRY (" + PORTFOLIO_CONFIG.githubUsername + ")";
    document.getElementById("track-status").textContent = PORTFOLIO_CONFIG.music.songTitle;

    const avatarImg = document.getElementById("profile-avatar");
    avatarImg.src = PORTFOLIO_CONFIG.avatarFile;
    avatarImg.onerror = () => {
      avatarImg.src = "https://github.com/" + PORTFOLIO_CONFIG.githubUsername + ".png";
    };

    const skillsContainer = document.getElementById("skills-container");
    const skillDetailBox = document.getElementById("skill-detail-box");
    PORTFOLIO_CONFIG.skills.forEach((skill, index) => {
      const btn = document.createElement("button");
      btn.className = "skill-pill" + (index === 0 ? " active-skill" : "");
      const levelColor = skill.highlight ? "style='color:#facc15;'" : "";
      btn.innerHTML = "<span class='dot' style='background:" + skill.color + "; box-shadow:0 0 8px " + skill.color + ";'></span> " + skill.name + " <small " + levelColor + ">" + skill.level + "</small>";
      btn.addEventListener("click", () => {
        document.querySelectorAll(".skill-pill").forEach(p => p.classList.remove("active-skill"));
        btn.classList.add("active-skill");
        skillDetailBox.textContent = skill.description;
      });
      skillsContainer.appendChild(btn);
      if (index === 0) skillDetailBox.textContent = skill.description;
    });

    const infoContainer = document.getElementById("info-container");
    PORTFOLIO_CONFIG.infoCards.forEach(item => {
      const box = document.createElement("div");
      box.className = "info-box";
      box.innerHTML = "<span class='label'>" + item.label + "</span><p>" + item.value + "</p>";
      infoContainer.appendChild(box);
    });

    const buttonsContainer = document.getElementById("buttons-container");
    PORTFOLIO_CONFIG.buttons.forEach(btnCfg => {
      if (btnCfg.copyText) {
        const btn = document.createElement("button");
        btn.className = "dock-btn" + (btnCfg.primary ? " primary" : "");
        btn.innerHTML = "<span>" + btnCfg.label + "</span>";
        btn.addEventListener("click", () => {
          navigator.clipboard.writeText(btnCfg.copyText);
          const span = btn.querySelector("span");
          span.textContent = "✅ Copied: " + btnCfg.copyText;
          setTimeout(() => (span.textContent = btnCfg.label), 2000);
        });
        buttonsContainer.appendChild(btn);
      } else {
        const link = document.createElement("a");
        link.className = "dock-btn" + (btnCfg.primary ? " primary" : "");
        link.href = btnCfg.url;
        link.target = "_blank";
        link.textContent = btnCfg.label;
        buttonsContainer.appendChild(link);
      }
    });

    // Audio System: Plays teapot.mp3 locally & online, with automatic synth fallback
    let isMusicPlaying = false;
    let audioMode = "mp3";
    let synthCtx = null, synthGain = null, synthTimer = null;

    const localAudio = document.getElementById("local-audio");
    const audioToggle = document.getElementById("audio-toggle");
    const equalizer = document.getElementById("equalizer");
    const volumeSlider = document.getElementById("volume-slider");
    const trackStatus = document.getElementById("track-status");

    volumeSlider.value = PORTFOLIO_CONFIG.music.defaultVolume;
    localAudio.src = PORTFOLIO_CONFIG.music.audioFile;
    localAudio.loop = true;
    localAudio.volume = volumeSlider.value / 100;

    function setPlayingUI(playing, label) {
      isMusicPlaying = playing;
      audioToggle.textContent = playing ? "❚❚" : "▶";
      equalizer.classList.toggle("playing", playing);
      if (label) trackStatus.textContent = label;
    }

    function startSynthFallback() {
      audioMode = "synth";
      if (!synthCtx) {
        synthCtx = new (window.AudioContext || window.webkitAudioContext)();
        synthGain = synthCtx.createGain();
        synthGain.gain.value = (volumeSlider.value / 100) * 0.14;
        synthGain.connect(synthCtx.destination);
      }
      if (synthCtx.state === "suspended") synthCtx.resume();
      const chords = [
        [220.0, 261.63, 329.63, 392.0],
        [174.61, 220.0, 261.63, 329.63],
        [130.81, 196.0, 246.94, 293.66],
        [164.81, 196.0, 246.94, 329.63]
      ];
      let step = 0;
      const playChord = () => {
        if (!isMusicPlaying) return;
        const now = synthCtx.currentTime;
        chords[step % chords.length].forEach(freq => {
          const osc = synthCtx.createOscillator();
          const noteGain = synthCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now);
          noteGain.gain.setValueAtTime(0.001, now);
          noteGain.gain.exponentialRampToValueAtTime(0.25, now + 1.1);
          noteGain.gain.exponentialRampToValueAtTime(0.001, now + 3.6);
          osc.connect(noteGain);
          noteGain.connect(synthGain);
          osc.start(now);
          osc.stop(now + 3.8);
        });
        step++;
      };
      setPlayingUI(true, "Lo-Fi Synth (Add teapot.mp3)");
      playChord();
      clearInterval(synthTimer);
      synthTimer = setInterval(playChord, 3700);
    }

    function stopAudio() {
      if (audioMode === "mp3") localAudio.pause();
      if (audioMode === "synth") clearInterval(synthTimer);
      setPlayingUI(false);
    }

    function startAudio() {
      localAudio.play().then(() => {
        audioMode = "mp3";
        setPlayingUI(true, PORTFOLIO_CONFIG.music.songTitle);
      }).catch(() => {
        startSynthFallback();
      });
    }

    audioToggle.addEventListener("click", () => {
      isMusicPlaying ? stopAudio() : startAudio();
    });

    volumeSlider.addEventListener("input", e => {
      const vol = Number(e.target.value);
      localAudio.volume = vol / 100;
      if (synthGain) synthGain.gain.value = (vol / 100) * 0.14;
    });

    const canvas = document.getElementById("bg-canvas"), ctx = canvas.getContext("2d");
    let particles = [], trail = [], ripples = [], mouse = { x: null, y: null, radius: 140 };
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener("resize", resizeCanvas); resizeCanvas();

    window.addEventListener("mousemove", e => {
      mouse.x = e.x; mouse.y = e.y;
      trail.push({ x: e.x, y: e.y, alpha: 1, size: 4 });
    });
    window.addEventListener("click", e => {
      ripples.push({ x: e.x, y: e.y, radius: 5, alpha: 0.8 });
    });

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.8;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
      draw() {
        ctx.fillStyle = "#38bdf8";
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      const count = Math.min(85, Math.floor((canvas.width * canvas.height) / 14500));
      for (let i = 0; i < count; i++) particles.push(new Particle());
    }
    initParticles();

    function animateCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update(); particles[i].draw();
        for (let j = i; j < particles.length; j++) {
          const dist = Math.hypot(particles[i].x - particles[j].x, particles[i].y - particles[j].y);
          if (dist < 115) {
            ctx.strokeStyle = "rgba(124, 58, 237, " + (1 - dist / 115) + ")";
            ctx.lineWidth = 0.7;
            ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
          }
        }
        if (mouse.x !== null) {
          const dist = Math.hypot(particles[i].x - mouse.x, particles[i].y - mouse.y);
          if (dist < mouse.radius) {
            ctx.strokeStyle = "rgba(6, 182, 212, " + (1 - dist / mouse.radius) + ")";
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
          }
        }
      }
      for (let i = trail.length - 1; i >= 0; i--) {
        const pt = trail[i];
        ctx.fillStyle = "rgba(6, 182, 212, " + pt.alpha + ")";
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
        pt.alpha -= 0.04; pt.size *= 0.95;
        if (pt.alpha <= 0) trail.splice(i, 1);
      }
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        ctx.strokeStyle = "rgba(124, 58, 237, " + rp.alpha + ")";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.radius, 0, Math.PI * 2); ctx.stroke();
        rp.radius += 3.5; rp.alpha -= 0.025;
        if (rp.alpha <= 0) ripples.splice(i, 1);
      }
      requestAnimationFrame(animateCanvas);
    }
    animateCanvas();

    const enterScreen = document.getElementById("enter-screen"), mainInterface = document.getElementById("main-interface");
    enterScreen.addEventListener("click", () => {
      enterScreen.classList.add("fade-out");
      mainInterface.classList.remove("hidden");
      startAudio();
      startTypewriter();
    });

    const card = document.getElementById("tilt-card"), glare = document.getElementById("card-glare");
    card.addEventListener("mousemove", e => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      const rotateX = ((y - rect.height / 2) / (rect.height / 2)) * -9;
      const rotateY = ((x - rect.width / 2) / (rect.width / 2)) * 9;
      card.style.transform = "rotateX(" + rotateX + "deg) rotateY(" + rotateY + "deg)";
      glare.style.opacity = "1";
      glare.style.background = "radial-gradient(circle at " + x + "px " + y + "px, rgba(255,255,255,0.16), transparent 65%)";
    });
    card.addEventListener("mouseleave", () => {
      card.style.transform = "rotateX(0deg) rotateY(0deg)";
      glare.style.opacity = "0";
    });

    let phraseIdx = 0, charIdx = 0, isDeleting = false;
    function startTypewriter() {
      const target = document.getElementById("typewriter");
      const current = PORTFOLIO_CONFIG.roles[phraseIdx];
      target.textContent = isDeleting ? current.substring(0, charIdx--) : current.substring(0, charIdx++);
      let speed = isDeleting ? 45 : 85;
      if (!isDeleting && charIdx === current.length + 1) { speed = 1600; isDeleting = true; }
      else if (isDeleting && charIdx === 0) { isDeleting = false; phraseIdx = (phraseIdx + 1) % PORTFOLIO_CONFIG.roles.length; speed = 350; }
      setTimeout(startTypewriter, speed);
    }

    document.querySelectorAll(".theme-dot").forEach(dot => {
      dot.addEventListener("click", () => {
        document.querySelectorAll(".theme-dot").forEach(d => d.classList.remove("active"));
        dot.classList.add("active");
        document.body.dataset.accent = dot.dataset.theme;
      });
    });

    function updateClock() {
      const timeStr = new Date().toLocaleTimeString("en-IN", { timeZone: PORTFOLIO_CONFIG.timezone, hour12: false });
      document.getElementById("live-clock").textContent = timeStr + " " + PORTFOLIO_CONFIG.timezoneLabel;
    }
    setInterval(updateClock, 1000); updateClock();

    async function loadGitHubData() {
      const username = PORTFOLIO_CONFIG.githubUsername;
      const repoContainer = document.getElementById("gh-repos");
      const countBadge = document.getElementById("gh-repo-count");
      try {
        const userRes = await fetch("https://api.github.com/users/" + username);
        if (!userRes.ok) throw new Error();
        const userData = await userRes.json();
        countBadge.textContent = userData.public_repos + " Public Repos";
        const reposRes = await fetch("https://api.github.com/users/" + username + "/repos?sort=updated&per_page=3");
        const repos = await reposRes.json();
        if (repos.length === 0) {
          repoContainer.innerHTML = "<div class='repo-item'><span>No public repositories yet — cooking soon!</span></div>";
          return;
        }
        repoContainer.innerHTML = repos.map(r => "<a href='" + r.html_url + "' target='_blank' class='repo-item'><span>📁 " + r.name + "</span><span class='repo-lang'>" + (r.language || "HTML/CSS") + "</span></a>").join("");
      } catch (e) {
        countBadge.textContent = username;
        repoContainer.innerHTML = "<a href='https://github.com/" + username + "' target='_blank' class='repo-item'><span>🚀 View Projects on GitHub</span><span class='repo-lang'>→</span></a>";
      }
    }
    loadGitHubData();
  </script>
</body>
</html>
